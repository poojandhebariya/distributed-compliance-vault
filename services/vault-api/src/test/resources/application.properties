spring.datasource.url=jdbc:h2:mem:vaulttest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false

app.storage.s3.endpoint=http://localhost:8333
app.storage.s3.region=us-east-1
app.storage.s3.bucket-raw=raw-zone
app.storage.s3.access-key=test-access-key
app.storage.s3.secret-key=test-secret-key

app.outbox.publisher.enabled=false
spring.task.scheduling.enabled=false