spring.application.name=vault-api

server.port=8080

management.endpoints.web.exposure.include=health,info

management.endpoint.health.probes.enabled=true


spring.datasource.url=jdbc:postgresql://postgres.vault-data.svc.cluster.local:5432/vaultdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true

# S3-compatible object storage (SeaweedFS)
app.storage.s3.endpoint=http://minio.vault-data.svc.cluster.local:8333
app.storage.s3.region=us-east-1
app.storage.s3.bucket-raw=raw-zone

# Credentials are supplied through environment variables
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}

# Kafka producer
spring.kafka.bootstrap-servers=kafka.vault-data.svc.cluster.local:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties[enable.idempotence]=true

# Transactional outbox publisher
app.outbox.publisher.enabled=true
app.outbox.publisher.topic=document-events
app.outbox.publisher.batch-size=10
app.outbox.publisher.poll-interval-ms=5000

app.storage.s3.bucket-clean=clean-zone
app.storage.s3.bucket-audit=audit-zone

# Kafka document consumer
app.processing.consumer.enabled=true
spring.kafka.consumer.group-id=vault-api-processing
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer