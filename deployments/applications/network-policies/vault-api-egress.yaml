apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-api-egress
  namespace: vault-app
spec:
  podSelector:
    matchLabels:
      app: vault-api
  policyTypes:
    - Egress
  egress:
    # DNS: CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # PostgreSQL only on 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-data
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

    # Kafka broker only on 9092
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-data
          podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092

    # S3-compatible storage only on 8333
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-data
          podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 8333
