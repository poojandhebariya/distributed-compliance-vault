apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: vault-data
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    # API and DLT topic initialization Job -> Kafka broker
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-app
          podSelector:
            matchLabels:
              app: vault-api
        - podSelector:
            matchLabels:
              app: kafka-dlt-topic
      ports:
        - protocol: TCP
          port: 9092

    # Kafka controller listener
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9093
