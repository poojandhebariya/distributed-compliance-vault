
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compliance-vault-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/poojandhebariya/distributed-compliance-vault.git
    targetRevision: main
    path: deployments
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
